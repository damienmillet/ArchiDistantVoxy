[package]
name = "lod-core"
description = "Distant Horizons LOD protocol (v16) codec, section builder and throttling for ArchiDistantVoxy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bytes = "1"

[features]
sqlite = ["dep:rusqlite"]

[dependencies.rusqlite]
version = "0.32"
features = ["bundled"]
optional = true

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[lints]
workspace = true
