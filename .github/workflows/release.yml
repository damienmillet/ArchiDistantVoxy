name: Release artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # pumpkin-data is a ~88 MB generated crate: reduce rustc memory.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false
  CARGO_NET_RETRY: 3

jobs:
  build-linux:
    name: Build libarchidistantvoxy.so (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release cdylib
        run: cargo build -p archidistantvoxy --release
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp target/release/libarchidistantvoxy.so artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: archidistantvoxy-linux-x86_64
          path: artifacts/
          if-no-files-found: error

  build-windows:
    name: Build archidistantvoxy.dll (windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release cdylib
        run: cargo build -p archidistantvoxy --release
      - name: Collect artifact
        run: |
          mkdir artifacts
          copy target\release\archidistantvoxy.dll artifacts\
      - uses: actions/upload-artifact@v4
        with:
          name: archidistantvoxy-windows-x86_64
          path: artifacts/
          if-no-files-found: error

  build-linux-arm:
    name: Build libarchidistantvoxy.so (linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release cdylib
        run: cargo build -p archidistantvoxy --release
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp target/release/libarchidistantvoxy.so artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: archidistantvoxy-linux-arm64
          path: artifacts/
          if-no-files-found: error

  build-macos-arm:
    name: Build libarchidistantvoxy.dylib (macos arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build release cdylib for Apple Silicon
        run: cargo build -p archidistantvoxy --release --target aarch64-apple-darwin
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp target/aarch64-apple-darwin/release/libarchidistantvoxy.dylib artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: archidistantvoxy-macos-arm64
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-linux, build-windows, build-linux-arm, build-macos-arm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp artifacts/archidistantvoxy-linux-x86_64/libarchidistantvoxy.so release-assets/archidistantvoxy-linux-x86_64.so
          cp artifacts/archidistantvoxy-linux-arm64/libarchidistantvoxy.so release-assets/archidistantvoxy-linux-arm64.so
          cp artifacts/archidistantvoxy-windows-x86_64/archidistantvoxy.dll release-assets/archidistantvoxy-windows-x86_64.dll
          cp artifacts/archidistantvoxy-macos-arm64/libarchidistantvoxy.dylib release-assets/archidistantvoxy-macos-arm64.dylib
      - name: Create the GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*
