name: Release artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # pumpkin-data is a ~88 MB generated crate: reduce rustc memory.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_DEV_INCREMENTAL: false
  CARGO_NET_RETRY: 3

jobs:
  build-linux:
    name: Build libarchidistantvoxy.so (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release cdylib
        run: cargo build -p archidistantvoxy --release
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp target/release/libarchidistantvoxy.so artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: archidistantvoxy-linux-x86_64
          path: artifacts/
          if-no-files-found: error

  build-windows:
    name: Build archidistantvoxy.dll (windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release cdylib
        run: cargo build -p archidistantvoxy --release
      - name: Collect artifact
        run: |
          mkdir artifacts
          copy target\release\archidistantvoxy.dll artifacts\
      - uses: actions/upload-artifact@v4
        with:
          name: archidistantvoxy-windows-x86_64
          path: artifacts/
          if-no-files-found: error

  build-macos-arm:
    name: Build libarchidistantvoxy.dylib (macos arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build release cdylib for Apple Silicon
        run: cargo build -p archidistantvoxy --release --target aarch64-apple-darwin
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp target/aarch64-apple-darwin/release/libarchidistantvoxy.dylib artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: archidistantvoxy-macos-arm64
          path: artifacts/
          if-no-files-found: error
